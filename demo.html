<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>TOPNOTE — Animación de llenado</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #0a0a0f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
  }

  .perfume-stage {
    position: relative;
    width: 500px;
    aspect-ratio: 600 / 737;
    overflow: hidden;
  }

  .perfume-stage img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    user-select: none;
    -webkit-user-drag: none;
  }

  .perfume-empty { z-index: 1; }

  .perfume-full {
    z-index: 2;
    animation: fillBottle 10s ease-in-out infinite;
  }

  @keyframes fillBottle {
    0%   { clip-path: inset(100% 0 0 0); }
    45%  { clip-path: inset(0% 0 0 0); }
    75%  { clip-path: inset(0% 0 0 0); }
    95%  { clip-path: inset(100% 0 0 0); }
    100% { clip-path: inset(100% 0 0 0); }
  }

  .perfume-stage:hover .perfume-full {
    animation-play-state: paused;
  }
</style>
</head>
