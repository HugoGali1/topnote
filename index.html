<body>
<div id="root">
  <div class="__boot">topnote · cargando…</div>
</div>

<script>
  /* ============================================================
     POLYFILLS — para correr el artifact en navegador estándar
     ============================================================ */
  // window.storage es API específica de Claude artifacts. Usamos localStorage como backend.
  window.storage = {
    async getItem(k)    { return localStorage.getItem(k); },
    async setItem(k, v) { localStorage.setItem(k, v); },
    async removeItem(k) { localStorage.removeItem(k); }
  };

  // Llamamos a Google Gemini directamente desde el navegador. CORS habilitado
  // por Google. La key se guarda en localStorage y solo viaja a Google.
  window.claude = {
    async complete(prompt, options) {
      // Limpieza de migración: si quedaba clave antigua de Anthropic, fuera.
      if (localStorage.getItem('topnote.anthropic_key')) {
        localStorage.removeItem('topnote.anthropic_key');
      }
      options = options || {};

      let apiKey = localStorage.getItem('topnote.gemini_key');
      if (!apiKey) {
        apiKey = window.prompt(
          'Top Note — Introduce tu API key de Google Gemini (AIza...)\n\n' +
          'Consíguela gratis en https://aistudio.google.com/apikey\n' +
          'Se guarda solo en este navegador y se envía únicamente a generativelanguage.googleapis.com.'
        );
        if (!apiKey || !apiKey.trim()) {
          throw new Error('Se requiere una API key de Gemini para consultar al perfumista.');
        }
        localStorage.setItem('topnote.gemini_key', apiKey.trim());
      }

      const model = 'gemini-2.5-flash';
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
      const generationConfig = {
        maxOutputTokens: options.maxOutputTokens || 16384,
        responseMimeType: 'application/json',
        // Desactivamos el "thinking" de Gemini 2.5. Los tokens de razonamiento
        // interno cuentan contra maxOutputTokens y truncaban la salida JSON.
        // Para ranking sobre 80 candidatos no necesitamos chain-of-thought.
        thinkingConfig: { thinkingBudget: 0 }
      };
      if (options.responseSchema) generationConfig.responseSchema = options.responseSchema;
      const body = JSON.stringify({
        contents: [{ role: 'user', parts: [{ text: prompt }] }],
        generationConfig
      });

      // Reintento con backoff exponencial para 503 (modelo sobrecargado) y
      // errores transitorios de red. No reintenta en 4xx (problema del cliente).
      const backoffsMs = [1200, 3500, 8000];
      let res = null;
      let lastErr = null;
      for (let attempt = 0; attempt <= backoffsMs.length; attempt++) {
        try {
          res = await fetch(endpoint, {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              'x-goog-api-key': apiKey.trim()
            },
            body
          });
        } catch (e) {
          lastErr = e;
          if (attempt < backoffsMs.length) {
            await new Promise((r) => setTimeout(r, backoffsMs[attempt]));
            continue;
          }
          throw new Error('No se ha podido contactar con la API de Gemini. Comprueba tu conexión.');
        }
        if (res.ok) break;
        // Estados transitorios -> reintentar
        if ((res.status === 503 || res.status === 502 || res.status === 504)
            && attempt < backoffsMs.length) {
          await new Promise((r) => setTimeout(r, backoffsMs[attempt]));
          continue;
        }
        break;
      }
      if (!res) throw lastErr || new Error('Sin respuesta de Gemini.');
      if (!res.ok) {
        const txt = await res.text().catch(() => '');
        if (res.status === 400 && /API_KEY/i.test(txt)) {
          localStorage.removeItem('topnote.gemini_key');
          throw new Error('API key inválida. Recarga la página para reintroducirla.');
        }
        if (res.status === 401 || res.status === 403) {
          localStorage.removeItem('topnote.gemini_key');
          throw new Error('API key sin permisos. Recarga la página para reintroducirla.');
        }
        if (res.status === 429) {
          throw new Error('Cuota gratuita agotada (o demasiadas req/min). Inténtalo en unos minutos.');
        }
        if (res.status === 503) {
          throw new Error('Gemini está sobrecargado ahora mismo (lo intenté 4 veces). Espera 1-2 min y reintenta.');
        }
        throw new Error('La API ha respondido con error ' + res.status + '. ' + txt.slice(0, 160));
      }
      const data = await res.json();
      const cand = data && data.candidates && data.candidates[0];
      const text = cand && cand.content && cand.content.parts &&
                   cand.content.parts[0] && cand.content.parts[0].text;
      if (!text) {
        const fr = cand && cand.finishReason;
        throw new Error('Respuesta inesperada de Gemini' + (fr ? ` (finishReason: ${fr})` : '') + '.');
      }
      if (cand.finishReason && cand.finishReason !== 'STOP') {
        // Truncado a mitad: avisamos pero devolvemos lo que haya por si es parseable.
        console.warn('[Gemini] respuesta no terminó limpia. finishReason=', cand.finishReason);
      }
      return text;
    }
  };

  // Reset desde consola: resetTopNote()
  window.resetTopNote = function () {
    localStorage.removeItem('topnote.gemini_key');
    localStorage.removeItem('topnote.anthropic_key');   // legacy
    localStorage.removeItem('topnote.favorites.v1');
    localStorage.removeItem('topnote.history.v1');
    location.reload();
  };
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

/* ============================================================
   FRAMER MOTION — helpers de animación on-scroll
   · Si la librería no cargó (offline / CDN caído), todo se
     renderiza estático sin animación (fallback transparente).
   ============================================================ */
const FM = (typeof window !== 'undefined') ? window.Motion : null;
const motion = FM && FM.motion;

const EASE_CINE = [0.22, 1, 0.36, 1];  // ease "expo.out" — cinemático

/** Aparece desde abajo con fade. Úsalo para envolver un bloque. */
function Reveal({ children, delay = 0, y = 60, duration = 1.1, once = true, className, style }) {
  if (!motion) return <div className={className} style={style}>{children}</div>;
  return (
    <motion.div
      className={className}
      style={style}
      initial={{ opacity: 0, y }}
      whileInView={{ opacity: 1, y: 0 }}
      viewport={{ once, margin: '-10% 0px -10% 0px' }}
      transition={{ duration, delay, ease: EASE_CINE }}
    >
      {children}
    </motion.div>
  );
}

/** Stagger de hijos directos. Los hijos heredan el efecto fade-up. */
function Stagger({ children, gap = 0.09, delay = 0, y = 48, duration = 1.0, className, style, as = 'div' }) {
  if (!motion) {
    const Tag = as;
    return <Tag className={className} style={style}>{children}</Tag>;
  }
  const Mtag = motion[as] || motion.div;
  const childVariants = {
    hidden:  { opacity: 0, y },
    visible: { opacity: 1, y: 0, transition: { duration, ease: EASE_CINE } },
  };
  return (
    <Mtag
      className={className}
      style={style}
      initial="hidden"
      whileInView="visible"
      viewport={{ once: true, margin: '-8% 0px -8% 0px' }}
      transition={{ staggerChildren: gap, delayChildren: delay }}
      variants={{ hidden: {}, visible: {} }}
    >
      {React.Children.map(children, (child, i) => (
        child == null || child === false
          ? null
          : <motion.div variants={childVariants} key={i}>{child}</motion.div>
      ))}
    </Mtag>
  );
}

/** Tarjeta con micro-hover: lift + glow sutil. */
function MotionCard({ children, onClick, className, delay = 0, index = 0 }) {
  if (!motion) {
    return <div className={className} onClick={onClick}>{children}</div>;
  }
  return (
    <motion.div
      className={className}
      onClick={onClick}
      initial={{ opacity: 0, y: 40 }}
      whileInView={{ opacity: 1, y: 0 }}
      viewport={{ once: true, margin: '-5% 0px -5% 0px' }}
      transition={{ duration: 0.85, ease: EASE_CINE, delay: delay + index * 0.06 }}
      whileHover={{ y: -8, transition: { duration: 0.35, ease: EASE_CINE } }}
    >
      {children}
    </motion.div>
  );
}

/* === ICONOS principales (los que el código de App utiliza) === */
const __ic = (paths, p) => (
  <svg width={p.size||16} height={p.size||16} viewBox="0 0 24 24"
       fill={p.fill||'none'} stroke="currentColor"
       strokeWidth={p.strokeWidth||1.6} strokeLinecap="round" strokeLinejoin="round"
       className={p.className||''}>
    {paths}
  </svg>
);
const Heart = (p) => __ic(<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>, p);
const X = (p) => __ic(<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>, p);
const Clock = (p) => __ic(<><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>, p);
// ArrowRight / ArrowLeft / ArrowUpRight ya no se usan en la nueva UI (las llamadas usan los SvgArrow* del App)

/* === APP === */
/* ============================================================
   CATÁLOGO OLFATIVO — cargado desde data/catalog.json (dataset Parfumo).
   Generado por scripts/ingest_parfumo.py · ver README.md
   ============================================================ */
let CATALOG = [];   /* poblado en runtime desde data/catalog.json */
const CATALOG_PATH = 'data/catalog.json';

/* ============================================================
   CONSTANTES UI
   ============================================================ */
const PLACEHOLDER_EXAMPLES = [
  'Algo dulce para invierno, parecido a Baccarat Rouge 540 pero más asequible y para uso diario...',
  'Una fragancia masculina elegante para la oficina; fresca pero con presencia...',
  'Perfume floral para una primera cita en primavera, sin ser empalagoso...',
  'Un oriental especiado para noches frías; algo memorable y poco común...',
];

const EXAMPLE_QUERIES = [
  'Dame algo como Sauvage pero más maduro y menos común',
  'Algo amaderado de oficina, fresco pero con presencia',
  'Un gourmand de vainilla y tabaco para invierno',
  'Un floral ligero de primavera con jazmín o flor de naranjo',
  'Mi pareja usa Coco Mademoiselle; quiero algo distinto pero compatible',
];

const SEASON_OPTIONS = ['primavera', 'verano', 'otoño', 'invierno'];
const GENDER_OPTIONS = ['masculino', 'femenino', 'unisex'];
const FAMILIA_OPTIONS = ['amaderada', 'oriental', 'floral', 'cítrica', 'gourmand', 'chipre', 'fougère'];

const STORAGE_KEYS = {
  FAVORITES: 'topnote.favorites.v1',
  HISTORY: 'topnote.history.v1',
};

const FAMILIA_LABELS = {
  amaderada: 'Amaderada',
  oriental: 'Oriental',
  floral: 'Floral',
  'cítrica': 'Cítrica',
  gourmand: 'Gourmand',
  chipre: 'Chipre',
  'fougère': 'Fougère',
};

/* Tamaño máximo de candidatos que viajan en el prompt al LLM.
   Por encima de ~120 se va de tokens con un catálogo de 20k. */
const LLM_CANDIDATE_CAP = 80;

const cap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : '');
const fmtInt = (n) => (n == null ? '—' : Number(n).toLocaleString('es-ES'));

/* Construye una descripción corta a partir de las notas, ya que el dataset
   Parfumo no trae copy editorial. */
function autoDesc(p) {
  const head = (p.notas?.salida || [])[0];
  const heart = (p.notas?.corazon || [])[0];
  const base = (p.notas?.fondo || [])[0];
  const fam = FAMILIA_LABELS[p.familia] || p.familia || '';
  const parts = [head, heart, base].filter(Boolean);
  if (!parts.length) return `${fam}.`;
  return `${fam} con ${parts.join(', ')}.`;
}

/* ============================================================
   ALMACENAMIENTO
   ============================================================ */
async function loadStorage(key, fallback) {
  try {
    const v = await window.storage.getItem(key);
    return v ? JSON.parse(v) : fallback;
  } catch {
    return fallback;
  }
}
async function saveStorage(key, value) {
  try {
    await window.storage.setItem(key, JSON.stringify(value));
  } catch {
    /* silencio */
  }
}

/* ============================================================
   PREFILTRO CLIENT-SIDE
   ============================================================
   Con ~20k perfumes no podemos enviar todo al LLM. Pre-seleccionamos
   candidatos por:
     1. Filtros duros del UI (familia, género, temporada).
     2. Score textual contra notas/casa/familia/acordes desde el query.
     3. Prior de calidad (rating × log(1+votos)).
   Devolvemos top N (LLM_CANDIDATE_CAP) al perfumista para re-ranking. */
const STOPWORDS_ES = new Set([
  'de','la','el','los','las','un','una','unos','unas','y','o','con','sin','para',
  'que','como','algo','en','por','del','al','su','sus','muy','más','menos','pero',
  'me','mi','tu','lo','le','les','este','esta','estos','estas','ese','esa','esos',
  'esas','quiero','busco','dame','necesito','similar','similares','parecido','perfume',
  'perfumes','fragancia','fragancias','aroma','colonia','olor',
]);

function tokenizeQuery(q) {
  return (q || '')
    .toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')   // sin tildes para matcheo más permisivo
    .split(/[^a-z0-9]+/)
    .filter((t) => t.length >= 3 && !STOPWORDS_ES.has(t));
}

/* Indexa el blob textual de cada perfume una sola vez tras la carga. */
function ensureSearchIndex(catalog) {
  if (catalog.__indexed) return;
  for (const p of catalog) {
    const parts = [
      p.nombre, p.casa, p.familia,
      ...(p.notas?.salida || []),
      ...(p.notas?.corazon || []),
      ...(p.notas?.fondo || []),
      ...(p.acordes || []),
      ...(p.perfumistas || []),
    ];
    p.__blob = parts.join(' ').toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '');
    p.__quality = (p.rating || 0) * Math.log1p(p.rating_count || 0);
  }
  catalog.__indexed = true;
}

/* Diversificación: cap de candidatos por misma casa para que los resultados
   no estén dominados por 1-2 marcas con muchos flankers (Dior, Tom Ford…). */
const MAX_PER_CASA = 3;

function prefilter(query, filters, catalog, cap = LLM_CANDIDATE_CAP) {
  ensureSearchIndex(catalog);
  const tokens = tokenizeQuery(query);

  let pool = catalog;
  if (filters?.familia) pool = pool.filter((p) => p.familia === filters.familia);
  if (filters?.gender)  pool = pool.filter((p) => p.genero === filters.gender || p.genero === 'unisex');
  if (filters?.season)  pool = pool.filter((p) => (p.temporada || []).includes(filters.season));

  // Si los filtros vacían el pool, retrocedemos a catalog sin filtros para no romper la búsqueda.
  if (pool.length === 0) pool = catalog;

  const scored = new Array(pool.length);
  for (let i = 0; i < pool.length; i++) {
    const p = pool[i];
    let s = 0;
    if (tokens.length) {
      for (const t of tokens) if (p.__blob.indexOf(t) !== -1) s += 1;
    }
    // Prior de calidad reducido: rating × log(votos), pero con peso bajo para
    // que un match textual fuerte mande sobre la popularidad bruta.
    s += 0.01 * p.__quality;
    // Pequeño jitter (≤0.5) para romper empates de forma no determinista
    // y aportar variedad entre consultas similares.
    s += Math.random() * 0.5;
    scored[i] = [s, p];
  }
  scored.sort((a, b) => b[0] - a[0]);

  // Diversificación por casa: máx MAX_PER_CASA candidatos del mismo brand.
  const out = [];
  const casaCount = new Map();
  for (const [, p] of scored) {
    const casa = p.casa || 'unknown';
    const n = casaCount.get(casa) || 0;
    if (n >= MAX_PER_CASA) continue;
    casaCount.set(casa, n + 1);
    out.push(p);
    if (out.length >= cap) break;
  }
  return out;
}

/* ============================================================
   LLAMADA A LA IA
   ============================================================ */
async function getRecommendations(query, filters, catalog) {
  const candidates = prefilter(query, filters, catalog, LLM_CANDIDATE_CAP);
  if (candidates.length === 0) {
    throw new Error('No hay candidatos tras el prefiltro. Afloja los filtros o reformula.');
  }

  const compact = candidates.map((p) => ({
    id: p.id,
    nombre: p.nombre,
    casa: p.casa,
    año: p.año,
    notas: p.notas,
    familia: p.familia,
    acordes: p.acordes,
    temporada: p.temporada,
    genero: p.genero,
    rating: p.rating,
    rating_count: p.rating_count,
    similares_a: p.similares_a,
  }));

  const prompt = `Eres un experto perfumista profesional. Analiza la petición del usuario y el subconjunto de fragancias pre-filtrado, y devuelve EXCLUSIVAMENTE un array JSON con las 3 a 5 fragancias más relevantes, ordenadas de mayor a menor relevancia.

Cada elemento del array debe tener exactamente este formato:
{ "id": "<id_exacto_del_catalogo>", "score": <numero_0_100>, "reasoning": "<2-3 frases en español natural explicando por qué encaja con la petición concreta>" }

Reglas:
- Considera notas olfativas, familia, temporada, género y referencias a otros perfumes (campo similares_a).
- Si el usuario menciona un perfume conocido, prioriza los que tengan notas/familia equivalente o aparezcan en similares_a.
- El campo rating (0-10) y rating_count (votos) reflejan recepción del público; úsalos como prior secundario, NUNCA como criterio principal.
- Respeta los filtros (estación, género, familia) cuando estén indicados.
- El reasoning debe ser específico y mencionar notas o aspectos concretos de ese perfume que justifican el match. Nada genérico.
- Responde SOLO el array JSON. Sin markdown, sin bloques de código, sin texto introductorio.

PETICIÓN DEL USUARIO:
"${query}"

FILTROS APLICADOS:
${JSON.stringify(filters)}

CANDIDATOS (${compact.length} de ${catalog.length} en catálogo):
${JSON.stringify(compact)}`;

  // Schema explícito para que Gemini devuelva un array bien formado.
  // Gemini espera tipos en MAYÚSCULAS (enum Type de la API).
  const responseSchema = {
    type: 'ARRAY',
    items: {
      type: 'OBJECT',
      properties: {
        id: { type: 'STRING' },
        score: { type: 'INTEGER' },
        reasoning: { type: 'STRING' }
      },
      required: ['id', 'score', 'reasoning']
    }
  };
  const raw = await window.claude.complete(prompt, { responseSchema, maxOutputTokens: 8192 });

  let cleaned = String(raw).trim();
  // limpia fences ```json ... ``` por si acaso
  cleaned = cleaned.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/i, '');
  // si hay texto antes/después, intenta extraer el array
  const m = cleaned.match(/\[[\s\S]*\]/);
  if (m) cleaned = m[0];

  let parsed;
  try {
    parsed = JSON.parse(cleaned);
  } catch (e) {
    console.error('[LLM] Fallo al parsear JSON. Respuesta cruda:', raw);
    // Fallback: si el JSON fue truncado mid-array, reparamos cerrando el array
    // tras el último objeto bien formado.
    try {
      const lastClose = cleaned.lastIndexOf('}');
      if (lastClose > 0) {
        const repaired = cleaned.slice(0, lastClose + 1) + ']';
        parsed = JSON.parse(repaired);
        console.warn('[LLM] JSON truncado — reparado con', Array.isArray(parsed) ? parsed.length : '?', 'recomendaciones.');
      } else {
        throw e;
      }
    } catch (e2) {
      throw new Error('La respuesta del perfumista venía truncada. Reintente la consulta.');
    }
  }
  // Gemini con responseSchema puede envolver el array en {results: [...]}
  // o {recommendations: [...]} — desempaquetamos si hace falta.
  if (!Array.isArray(parsed) && parsed && typeof parsed === 'object') {
    const arrField = Object.values(parsed).find((v) => Array.isArray(v));
    if (arrField) parsed = arrField;
  }
  if (!Array.isArray(parsed) || parsed.length === 0) {
    console.error('[LLM] Respuesta no contiene array. Cruda:', raw);
    throw new Error('El perfumista no ha devuelto recomendaciones. Reformule la consulta.');
  }
  // filtra resultados con id válido (debe estar en el catálogo)
  const valid = parsed.filter((r) => r && r.id && CATALOG.some((p) => p.id === r.id));
  if (valid.length === 0) {
    throw new Error('Las recomendaciones no coinciden con el catálogo. Reintente.');
  }
  return valid.slice(0, 5);
}

/* ============================================================
   FAMILIAS — tinte cromático del frame
   ============================================================ */
const FAMILY_TINT = {
  gourmand:   { from: '#FFF3E0', to: '#FBDCBE', accent: '#C77F3E', soft: '#FDE9D2' },
  oriental:   { from: '#FAF1DC', to: '#F0DDB0', accent: '#A2791B', soft: '#F6E8C7' },
  amaderada:  { from: '#F2EDE2', to: '#D9CFB6', accent: '#7B6940', soft: '#EAE3D0' },
  floral:     { from: '#FFEFF4', to: '#FBD0DD', accent: '#C25577', soft: '#FBDFE8' },
  'cítrica':  { from: '#FBFCEA', to: '#E9EFA8', accent: '#8FA033', soft: '#F2F5C8' },
  chipre:     { from: '#EFF6E9', to: '#CDE4C0', accent: '#557C49', soft: '#DDEAD0' },
  'fougère':  { from: '#E9F4F1', to: '#C7E2DC', accent: '#3F7F73', soft: '#D4E8E2' },
};
const getTint = (fam) => FAMILY_TINT[fam] || { from: '#F5F6F8', to: '#EEEFF2', accent: '#6B7480', soft: '#F0F1F4' };

/* ============================================================
   COMPONENTE RAÍZ
   ============================================================ */
function TopNote() {
  const [view, setView] = useState('search'); // 'search' | 'results' | 'archive' | 'catalog'
  const [query, setQuery] = useState('');
  const [filters, setFilters] = useState({ familia: null, season: null, gender: null });
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [results, setResults] = useState([]);
  const [lastQuery, setLastQuery] = useState('');
  const [lastFilters, setLastFilters] = useState(null);
  const [favorites, setFavorites] = useState([]);
  const [history, setHistory] = useState([]);
  const [detail, setDetail] = useState(null); // { perfume, score, reasoning }
  const [showFilters, setShowFilters] = useState(false);

  // Carga del catálogo Parfumo
  const [catalogState, setCatalogState] = useState({ status: 'loading', error: null, count: 0 });

  useEffect(() => {
    (async () => {
      try {
        const res = await fetch(CATALOG_PATH, { cache: 'force-cache' });
        if (!res.ok) throw new Error(`HTTP ${res.status} al cargar el catálogo.`);
        const data = await res.json();
        const arr = Array.isArray(data) ? data : data.perfumes;
        if (!Array.isArray(arr) || arr.length === 0) {
          throw new Error('El catálogo está vacío. Ejecuta scripts/ingest_parfumo.py.');
        }
        CATALOG = arr;
        // Indexa el blob de búsqueda eagerly para que la primera query no pague el coste.
        ensureSearchIndex(CATALOG);
        setCatalogState({ status: 'ready', error: null, count: arr.length });
      } catch (e) {
        setCatalogState({
          status: 'error',
          error: e.message || 'No se ha podido cargar el catálogo.',
          count: 0,
        });
      }
    })();
  }, []);

  useEffect(() => {
    (async () => {
      const f = await loadStorage(STORAGE_KEYS.FAVORITES, []);
      const h = await loadStorage(STORAGE_KEYS.HISTORY, []);
      setFavorites(f);
      setHistory(h);
    })();
  }, []);

  // bloqueo de scroll cuando hay modal
  useEffect(() => {
    if (detail) {
      const orig = document.body.style.overflow;
      document.body.style.overflow = 'hidden';
      return () => { document.body.style.overflow = orig; };
    }
  }, [detail]);

  // ESC cierra modal
  useEffect(() => {
    if (!detail) return;
    const onKey = (e) => { if (e.key === 'Escape') setDetail(null); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [detail]);

  async function runQuery(q, f) {
    const useF = f || filters;
    setQuery(q);
    setFilters(useF);
    setLastQuery(q);
    setLastFilters(useF);
    setLoading(true);
    setError(null);
    setResults([]);
    setView('results');
    window.scrollTo({ top: 0, behavior: 'smooth' });

    try {
      const recs = await getRecommendations(q, useF, CATALOG);
      setResults(recs);
      const entry = { query: q, filters: useF, timestamp: Date.now() };
      const newHist = [entry, ...history.filter((h) => h.query !== q)].slice(0, 10);
      setHistory(newHist);
      await saveStorage(STORAGE_KEYS.HISTORY, newHist);
    } catch (err) {
      setError(err.message || 'No se ha podido completar la consulta.');
    } finally {
      setLoading(false);
    }
  }

  const onSubmit = () => {
    if (!query.trim() || loading) return;
    if (catalogState.status !== 'ready') return;
    runQuery(query.trim(), filters);
  };

  const onRetry = () => { if (lastQuery) runQuery(lastQuery, lastFilters); };

  const toggleFavorite = async (id) => {
    const newFavs = favorites.includes(id) ? favorites.filter((f) => f !== id) : [...favorites, id];
    setFavorites(newFavs);
    await saveStorage(STORAGE_KEYS.FAVORITES, newFavs);
  };

  const onCardOpen = (data) => setDetail(data);
  const onCloseDetail = () => setDetail(null);

  const onSimilar = (perfume) => {
    setDetail(null);
    const q = `Recomiéndame fragancias similares a ${perfume.nombre} de ${perfume.casa}, con perfil olfativo equivalente; incluye opciones de distintas casas.`;
    runQuery(q, { familia: null, season: null, gender: null });
  };

  const onRunHistory = (h) => runQuery(h.query, h.filters);

  const onPickExample = (ex) => {
    setQuery(ex);
    // foco implícito al cambiar el value
  };

  if (catalogState.status === 'loading') {
    return (
      <div style={{ background: 'var(--bg)', color: 'var(--ink)', minHeight: '100vh' }}>
        <ThemeStyles />
        <div className="__boot" style={{ minHeight: '100vh' }}>topnote · cargando catálogo…</div>
      </div>
    );
  }

  if (catalogState.status === 'error') {
    return (
      <div style={{ background: 'var(--bg)', color: 'var(--ink)', minHeight: '100vh' }}>
        <ThemeStyles />
        <main className="tn-main" style={{ padding: '120px 40px' }}>
          <h1 style={{ fontSize: 36, marginBottom: 16, letterSpacing: '-0.02em' }}>No se ha podido cargar el catálogo</h1>
          <p style={{ color: 'var(--ink-mute)', fontSize: 16, marginBottom: 28, maxWidth: 640 }}>
            {catalogState.error}
          </p>
          <p style={{ color: 'var(--ink-soft)', fontSize: 14, maxWidth: 640 }}>
            Genera el catálogo siguiendo las instrucciones del <code>README.md</code>:<br />
            <code style={{ background: 'var(--bg-soft)', padding: '2px 8px', borderRadius: 4 }}>
              python scripts/ingest_parfumo.py
            </code>
            <br />
            Y sirve la app por HTTP (no <code>file://</code>):
            <br />
            <code style={{ background: 'var(--bg-soft)', padding: '2px 8px', borderRadius: 4 }}>
              python -m http.server 8000
            </code>
          </p>
        </main>
      </div>
    );
  }

  return (
    <div style={{ background: 'var(--bg)', color: 'var(--ink)', minHeight: '100vh' }}>
      <ThemeStyles />
      <Header
        view={view}
        setView={setView}
        favoritesCount={favorites.length}
        historyCount={history.length}
        onToggleFilters={() => setShowFilters((s) => !s)}
      />

      {view === 'search' && (
        <SearchView
          query={query}
          setQuery={setQuery}
          onSubmit={onSubmit}
          loading={loading}
          error={error}
          onRetry={onRetry}
          filters={filters}
          setFilters={setFilters}
          showFilters={showFilters}
          setShowFilters={setShowFilters}
          onExample={onPickExample}
        />
      )}

      {view === 'results' && (
        <ResultsView
          query={lastQuery || query}
          filters={lastFilters || filters}
          results={results}
          loading={loading}
          error={error}
          onBack={() => setView('search')}
          onRetry={onRetry}
          onCardOpen={onCardOpen}
          favorites={favorites}
          toggleFavorite={toggleFavorite}
        />
      )}

      {view === 'archive' && (
        <ArchiveView
          favorites={favorites}
          history={history}
          toggleFavorite={toggleFavorite}
          onCardOpen={onCardOpen}
          onRunHistory={onRunHistory}
          onGoSearch={() => setView('search')}
        />
      )}

      {view === 'catalog' && (
        <CatalogView
          favorites={favorites}
          toggleFavorite={toggleFavorite}
          onCardOpen={onCardOpen}
          onGoSearch={() => setView('search')}
        />
      )}

      {detail && (
        <DetailModal
          {...detail}
          isFavorite={favorites.includes(detail.perfume.id)}
          onToggleFavorite={() => toggleFavorite(detail.perfume.id)}
          onSimilar={() => onSimilar(detail.perfume)}
          onClose={onCloseDetail}
        />
      )}
    </div>
  );
}

      .tn-corner {

      .tn-cat-meta-l { display: inline-flex; gap: 6px; flex-wrap: wrap; }

      /* ─── Paginación ───────────────────────────────────────────── */
      .tn-pagination {
        margin: 36px 0 24px;

      }
      .tn-pag-btn {

        border-radius: 10px;

      .tn-pag-btn:hover:not(:disabled):not(.on) {

      .tn-pag-btn:disabled { opacity: 0.35; cursor: not-allowed; }

      }

      .tn-pag-ellipsis {
        min-width: 26px; height: 38px;
        display: inline-flex; align-items: center; justify-content: center;

      }

      /* ─── Responsive ───────────────────────────────────────────── */
      @media (max-width: 980px) {
        .tn-head { padding: 14px 24px; }
        .tn-main { padding: 0 24px; }
        .tn-grid { grid-template-columns: repeat(2, 1fr); gap: 18px; }

        .tn-hero { padding: 48px 0 32px; }
        .tn-composer input { font-size: 18px; }
        .tn-title { font-size: clamp(48px, 11vw, 72px); }
        /* En móvil el hero pasa a una columna; la botella se mueve debajo
           de las acciones para que el composer permanezca above-the-fold. */
        .tn-hero.tn-hero--home {
          grid-template-columns: 1fr;
          gap: 36px;
        }
        .tn-hero--home .tn-hero-right { order: 2; }
        .tn-hero--home .tn-hero-left  { order: 1; }
        .tn-bottle-stage { max-width: 300px; margin: 0 auto; }
        .tn-cat-bar {
          grid-template-columns: 1fr;
          gap: 12px;
        }
        .tn-cat-sort { flex-wrap: wrap; }

      @media (max-width: 560px) {
        .tn-grid { grid-template-columns: 1fr; }

      ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; border: 2px solid var(--bg); }
      ::-webkit-scrollbar-thumb:hover { background: var(--ink-mute); }
    `}</style>
  );
}

/* ============================================================
   SEARCH VIEW
   ============================================================ */
const QUICK_TAGS = [
  { label: 'Dulce para invierno', q: 'Algo dulce y cálido para invierno' },
  { label: 'Como Sauvage pero más maduro', q: 'Algo como Sauvage pero más maduro y menos común' },
  { label: 'Oficina elegante', q: 'Perfume elegante y discreto para oficina' },
  { label: 'Gourmand de invierno', q: 'Algo gourmand de vainilla y tabaco para invierno que dure todo el día' },
  { label: 'Amaderado intenso', q: 'Un amaderado intenso con oud y sándalo para noches frías' },
  { label: 'Floral primera cita', q: 'Perfume floral para una primera cita en primavera, sin ser empalagoso' },
];

const PLACEHOLDERS = [
  'Descríbelo. Dulce para invierno, parecido a Sauvage pero más complejo…',
  'Un perfume gourmand de vainilla y café para tardes frías…',
  'Algo masculino para la oficina, fresco pero con presencia…',
  'Un oriental especiado con incienso y ámbar, poco común…',
];

function SearchView({ query, setQuery, onSubmit, loading, error, onRetry, filters, setFilters, showFilters, setShowFilters, onExample }) {
  const inputRef = useRef(null);
  const [phIdx, setPhIdx] = useState(0);

  useEffect(() => {
    const t = setInterval(() => setPhIdx((i) => (i + 1) % PLACEHOLDERS.length), 4500);
    return () => clearInterval(t);
  }, []);

  const activeQ = query.trim().toLowerCase();
  const activeFilterCount = Object.values(filters).filter((v) => v !== null).length;

  return (
    <main className="tn-main">
      <section className="tn-hero tn-hero--home">
        <Stagger className="tn-hero-left" gap={0.11} duration={1.05} y={56}>
          <span className="tn-pill">
            <span className="dot" />
            IA · En línea
          </span>
          <h1 className="tn-title">
            Encuentra tu <em>aroma.</em>
          </h1>
          <p className="tn-sub">
            Describe lo que buscas en lenguaje natural. Cruzamos {fmtInt(CATALOG.length)} fragancias del
            catálogo y devolvemos las más afines, con justificación.
          </p>

          <form
            className="tn-composer"
            onSubmit={(e) => { e.preventDefault(); onSubmit(); }}
          >
            <input
              ref={inputRef}
              type="text"
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              placeholder={PLACEHOLDERS[phIdx]}
              disabled={loading}
              autoFocus
            />
            <button
              type="submit"
              className={'tn-go' + (loading ? ' loading' : '')}
              disabled={!query.trim() || loading}
              aria-label="Buscar"
            >
              <SvgArrowRightThick />
            </button>
          </form>

          <div className="tn-tags">
            {QUICK_TAGS.map((t, i) => {
              const isActive = activeQ === t.q.toLowerCase();
              return (
                <button
                  key={i}
                  className={'tn-tag' + (isActive ? ' act' : '')}
                  onClick={() => onExample(t.q)}
                  type="button"
                >
                  {t.label}
                </button>
              );
            })}
            <button
              className={'tn-tag icon' + (showFilters ? ' act' : '')}
              onClick={() => setShowFilters(!showFilters)}
              type="button"
              aria-expanded={showFilters}
            >
              <SvgFilter size={13} stroke={2} /> Filtros
              {activeFilterCount > 0 && (
                <span style={{
                  marginLeft: 4, background: showFilters ? '#fff' : 'var(--blue)',
                  color: showFilters ? 'var(--ink)' : '#fff',
                  fontSize: 11, fontWeight: 700, padding: '1px 6px', borderRadius: 999,
                }}>{activeFilterCount}</span>
              )}
            </button>
          </div>

          {showFilters && (
            <FilterPanel filters={filters} setFilters={setFilters} />
          )}

          {error && (
            <div className="tn-error">
              <span><b>Error:</b> {error}</span>
              <button onClick={onRetry || onSubmit}>Reintentar →</button>
            </div>
          )}
        </Stagger>

        <HeroBottleColumn />
      </section>

      <Footer />
    </main>
  );
}

/* ============================================================
   HERO BOTTLE COLUMN — wrapper animado del frasco
   · Entra desde la derecha con scale + fade (look cinemático).
   ============================================================ */
function HeroBottleColumn() {
  if (!motion) {
    return (
      <div className="tn-hero-right" aria-hidden="true">
        <div className="tn-bottle-stage">
          <HeroBottle3D />
        </div>
      </div>
    );
  }
  return (
    <motion.div
      className="tn-hero-right"
      aria-hidden="true"
      initial={{ opacity: 0, scale: 0.86, x: 40 }}
      animate={{ opacity: 1, scale: 1, x: 0 }}
      transition={{ duration: 1.4, ease: EASE_CINE, delay: 0.25 }}
    >
      <div className="tn-bottle-stage">
        <HeroBottle3D />
      </div>
    </motion.div>
  );
}

/* ============================================================
   HERO BOTTLE 3D — Three.js (r147 UMD) · v3 "Simple & Clean"
   · LatheGeometry clásica (cuerpo + hombros + cuello).
   · Cristal con transmission moderada (no traga el líquido).
   · Líquido azul OPACO bien visible.
   · Tapa cilíndrica dorada simple.
   · Iluminación 3-point limpia. Sombra blur. Flotación + rotación.
   ============================================================ */
function HeroBottle3D() {
  const mountRef = useRef(null);

  useEffect(() => {
    const T = window.THREE;
    const mount = mountRef.current;
    if (!T || !mount) return;

    try {
      const cv = document.createElement('canvas');
      if (!cv.getContext('webgl') && !cv.getContext('experimental-webgl')) return;
    } catch (_e) { return; }

    const reducedMotion = window.matchMedia &&
      window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const W = mount.clientWidth  || 420;
    const H = mount.clientHeight || 560;
    const renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(W, H);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputEncoding = T.sRGBEncoding;
    renderer.toneMapping = T.NoToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.localClippingEnabled = true;
    mount.appendChild(renderer.domElement);

    const toDispose = [];

    const scene  = new T.Scene();
    const camera = new T.PerspectiveCamera(28, W / H, 0.1, 100);
    camera.position.set(0, 2.5, 12.0);
    camera.lookAt(0, 2.3, 0);

    // EnvMap: estudio neutro/frío — para que la plata refleje gris-acero
    //  (no cream ni amarillo). Dos softboxes claros lateralmente.
    const envRT = (() => {
      const W2 = 512, H2 = 256;
      const c = document.createElement('canvas');
      c.width = W2; c.height = H2;
      const ctx = c.getContext('2d');
      // Cielo neutro: blanco frío arriba → gris claro abajo
      const g = ctx.createLinearGradient(0, 0, 0, H2);
      g.addColorStop(0.00, '#e8edf2');
      g.addColorStop(0.45, '#d4dae1');
      g.addColorStop(1.00, '#7a8590');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W2, H2);
      // Softboxes blancos (luz neutra)
      const sun = (cx, cy, r, col) => {
        const rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        rg.addColorStop(0.0, col);
        rg.addColorStop(1.0, 'rgba(255,255,255,0)');
        ctx.fillStyle = rg; ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
      };
      sun(W2 * 0.25, H2 * 0.30, 140, 'rgba(255, 255, 255, 0.95)');
      sun(W2 * 0.75, H2 * 0.28, 120, 'rgba(245, 248, 252, 0.85)');

      const equirect = new T.CanvasTexture(c);
      equirect.mapping  = T.EquirectangularReflectionMapping;
      equirect.encoding = T.sRGBEncoding;
      equirect.needsUpdate = true;

      const pmrem = new T.PMREMGenerator(renderer);
      pmrem.compileEquirectangularShader();
      const rt = pmrem.fromEquirectangular(equirect);
      pmrem.dispose();
      equirect.dispose();
      return rt;
    })();
    scene.environment = envRT.texture;
    toDispose.push({ dispose: () => envRT.dispose() });

    // Iluminación 3-point neutra (sin cálida para que la plata salga gris)
    scene.add(new T.AmbientLight(0xFFFFFF, 0.40));
    const keyL = new T.DirectionalLight(0xFFFFFF, 1.05);
    keyL.position.set(4, 8, 6); scene.add(keyL);
    const fillL = new T.DirectionalLight(0xCFE0F0, 0.45);
    fillL.position.set(-5, 3, 4); scene.add(fillL);
    const rimL = new T.DirectionalLight(0xFFFFFF, 0.50);
    rimL.position.set(0, 4, -6); scene.add(rimL);

    // Grupo principal
    const btl = new T.Group();
    scene.add(btl);

    // ── Silueta del frasco — esquinas inferiores muy redondeadas
    const BW   = 1.08;   // semianchura del cuerpo (X)
    const BD   = 0.52;   // semi-profundidad (Z)
    const BR   = 0.55;   // esquinas inferiores grandes (look soft)
    const Y_BASE     = 0.05;
    const Y_BODY_TOP = 2.95;
    const Y_NECK_BOT = 3.30;
    const Y_NECK_TOP = 3.70;
    const NECK_W     = 0.38;

    // Shape de perfil frontal: rectángulo con esquinas inferiores
    // redondeadas, hombros inclinados, y cuello recto arriba.
    const shape = new T.Shape();
    shape.moveTo(-BW + BR, Y_BASE);
    shape.lineTo( BW - BR, Y_BASE);
    shape.quadraticCurveTo( BW, Y_BASE,  BW, Y_BASE + BR);
    shape.lineTo( BW, Y_BODY_TOP);                          // pared derecha
    shape.lineTo( NECK_W, Y_NECK_BOT);                      // hombro derecho
    shape.lineTo( NECK_W, Y_NECK_TOP);                      // cuello derecho
    shape.lineTo(-NECK_W, Y_NECK_TOP);                      // tope cuello
    shape.lineTo(-NECK_W, Y_NECK_BOT);                      // cuello izquierdo
    shape.lineTo(-BW, Y_BODY_TOP);                          // hombro izquierdo
    shape.lineTo(-BW, Y_BASE + BR);                         // pared izquierda
    shape.quadraticCurveTo(-BW, Y_BASE, -BW + BR, Y_BASE);

    const bodyGeo = new T.ExtrudeGeometry(shape, {
      depth: BD * 2,
      bevelEnabled: true,
      bevelSize: 0.03,
      bevelThickness: 0.03,
      bevelSegments: 2,
      curveSegments: 12,
    });
    bodyGeo.translate(0, 0, -BD);   // centrar en Z
    toDispose.push(bodyGeo);

    // Cristal: azul más oscuro y opaco — fondo para que el líquido destaque
    const bodyMat = new T.MeshPhysicalMaterial({
      color: 0x16294A,
      metalness: 0.0,
      roughness: 0.05,
      ior: 1.5,
      clearcoat: 1.0,
      clearcoatRoughness: 0.04,
      envMapIntensity: 0.5,
      transparent: true,
      opacity: 0.78,
      side: T.DoubleSide,
    });
    const bodyMesh = new T.Mesh(bodyGeo, bodyMat);
    btl.add(bodyMesh);
    toDispose.push(bodyMat);

    // Aristas suaves del cristal — sólo las salientes (>40°) para no
    //  llenar de líneas las facetas internas del extrude.
    const bodyEdges = new T.EdgesGeometry(bodyGeo, 40);
    const bodyEdgeMat = new T.LineBasicMaterial({
      color: 0x0A1428, transparent: true, opacity: 0.45,
    });
    btl.add(new T.LineSegments(bodyEdges, bodyEdgeMat));
    toDispose.push(bodyEdges, bodyEdgeMat);

    // Líquido azul dentro del cuerpo — Box que empieza por encima del
    //  radio de las esquinas (BR) para no sobresalir lateralmente.
    const liqInset = 0.06;
    const liqW = (BW - liqInset) * 2;
    const liqD = (BD - liqInset) * 2;
    const LIQ_BOX_BOTTOM = Y_BASE + BR;          // tope de las esquinas curvas
    const liqHFull = (Y_BODY_TOP - LIQ_BOX_BOTTOM) - liqInset;
    const liqGeo = new T.BoxGeometry(liqW, liqHFull, liqD);
    const fillPlane = new T.Plane(new T.Vector3(0, -1, 0), 0);
    const liqMat = new T.MeshPhysicalMaterial({
      color: 0x4FBFF0,
      metalness: 0.0,
      roughness: 0.10,
      ior: 1.36,
      clearcoat: 0.7,
      clearcoatRoughness: 0.10,
      envMapIntensity: 0.5,
      transparent: true,
      opacity: 0.92,
      side: T.DoubleSide,
      emissive: 0x1F7EC2,
      emissiveIntensity: 0.45,
      clippingPlanes: [fillPlane],
      clipShadows: false,
    });
    const liqMesh = new T.Mesh(liqGeo, liqMat);
    liqMesh.position.y = LIQ_BOX_BOTTOM + liqHFull / 2;
    btl.add(liqMesh);
    toDispose.push(liqGeo, liqMat);

    // Menisco superior: PlaneGeometry subdividida — sus vértices oscilan
    //  cada frame para simular pequeñas ondas en la superficie.
    const surfGeo = new T.PlaneGeometry(liqW, liqD, 24, 12);
    surfGeo.rotateX(-Math.PI / 2);
    const surfMat = new T.MeshPhysicalMaterial({
      color: 0x6FCEF4,
      metalness: 0.0,
      roughness: 0.05,
      clearcoat: 1.0,
      clearcoatRoughness: 0.03,
      envMapIntensity: 1.3,
      emissive: 0x2A8DD0,
      emissiveIntensity: 0.30,
    });
    const surfMesh = new T.Mesh(surfGeo, surfMat);
    btl.add(surfMesh);
    toDispose.push(surfGeo, surfMat);

    // Guardamos las posiciones base de la superficie para animar las ondas
    const surfPos = surfGeo.attributes.position;
    const surfBaseY = new Float32Array(surfPos.count);
    for (let i = 0; i < surfPos.count; i++) surfBaseY[i] = surfPos.getY(i);

    // ── Plata metálica real (metalness alto, base gris-fría neutra)
    const silverMat = new T.MeshPhysicalMaterial({
      color: 0xB8BEC6,
      metalness: 1.0,
      roughness: 0.28,
      envMapIntensity: 1.2,
      clearcoat: 0.6,
      clearcoatRoughness: 0.10,
    });
    toDispose.push(silverMat);

    // Aristas plata para reforzar siluetas metálicas
    const silverEdgeMat = new T.LineBasicMaterial({
      color: 0x3A4250, transparent: true, opacity: 0.6,
    });
    toDispose.push(silverEdgeMat);

    // ── Collarín ancho plateado sobre el cuello (joyería geométrica)
    const collarGeo = new T.BoxGeometry(NECK_W * 2 + 0.10, 0.08, BD * 2 + 0.10);
    const collarMesh = new T.Mesh(collarGeo, silverMat);
    collarMesh.position.y = Y_NECK_TOP + 0.04;
    collarMesh.add(new T.LineSegments(new T.EdgesGeometry(collarGeo), silverEdgeMat));
    btl.add(collarMesh);
    toDispose.push(collarGeo);

    // ── Base biselada bajo la tapa (pieza intermedia para joya apilada)
    const baseCapGeo = new T.BoxGeometry(NECK_W * 2 + 0.18, 0.14, BD * 2 + 0.18);
    const baseCapMesh = new T.Mesh(baseCapGeo, silverMat);
    baseCapMesh.position.y = Y_NECK_TOP + 0.08 + 0.07;
    baseCapMesh.add(new T.LineSegments(new T.EdgesGeometry(baseCapGeo), silverEdgeMat));
    btl.add(baseCapMesh);
    toDispose.push(baseCapGeo);

    // ── Tapa principal: prisma plateado encima de la base
    const CAP_W = NECK_W + 0.06;
    const CAP_H = 0.50;
    const CAP_D = BD + 0.03;
    const capGeo = new T.BoxGeometry(CAP_W * 2, CAP_H, CAP_D * 2);
    const capMesh = new T.Mesh(capGeo, silverMat);
    capMesh.position.y = Y_NECK_TOP + 0.22 + CAP_H / 2;
    capMesh.add(new T.LineSegments(new T.EdgesGeometry(capGeo), silverEdgeMat));
    btl.add(capMesh);
    toDispose.push(capGeo);

    // ── Etiqueta estilo Tom Ford: rectángulo marfil con marco dorado,
    //    serif elegante en mayúsculas, descriptor abajo, líneas decorativas.
    const labelTex = (() => {
      const cw = 1024, ch = 768;
      const c = document.createElement('canvas');
      c.width = cw; c.height = ch;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, cw, ch);

      // Fondo marfil cálido
      ctx.fillStyle = '#EFE7D6';
      ctx.fillRect(0, 0, cw, ch);

      // Sombras internas suaves (lados)
      const sideShade = ctx.createLinearGradient(0, 0, cw, 0);
      sideShade.addColorStop(0,   'rgba(110, 85, 40, 0.15)');
      sideShade.addColorStop(0.5, 'rgba(0, 0, 0, 0)');
      sideShade.addColorStop(1,   'rgba(110, 85, 40, 0.15)');
      ctx.fillStyle = sideShade;
      ctx.fillRect(0, 0, cw, ch);

      // Marco dorado brillante — grueso para que se vea a la escala del frasco
      const FRAME = '#D4A937';
      ctx.strokeStyle = FRAME;
      ctx.lineWidth = 14;
      ctx.strokeRect(28, 28, cw - 56, ch - 56);
      ctx.lineWidth = 5;
      ctx.strokeRect(58, 58, cw - 116, ch - 116);

      // Líneas decorativas horizontales con diamante central
      const orn = (cy) => {
        ctx.strokeStyle = FRAME;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(cw * 0.28, cy);
        ctx.lineTo(cw * 0.44, cy);
        ctx.moveTo(cw * 0.56, cy);
        ctx.lineTo(cw * 0.72, cy);
        ctx.stroke();
        // Diamante central (más grande)
        ctx.beginPath();
        ctx.moveTo(cw * 0.50, cy - 16);
        ctx.lineTo(cw * 0.50 + 16, cy);
        ctx.lineTo(cw * 0.50, cy + 16);
        ctx.lineTo(cw * 0.50 - 16, cy);
        ctx.closePath();
        ctx.fillStyle = FRAME;
        ctx.fill();
      };
      orn(178);
      orn(ch - 178);

      // Título serif TOPNOTE en mayúsculas, color marrón profundo
      ctx.fillStyle = '#2A1E0A';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '700 162px "Times New Roman", "Georgia", serif';
      ctx.fillText('TOPNOTE', cw / 2, ch / 2 - 30);

      // Subtítulo
      ctx.font = '500 46px "Times New Roman", "Georgia", serif';
      ctx.letterSpacing = '8px';
      ctx.fillStyle = '#5A4218';
      ctx.fillText('FRAGRANCE  GUIDE', cw / 2, ch / 2 + 90);

      // Línea muy fina bajo el subtítulo
      ctx.strokeStyle = '#5A4218';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(cw * 0.36, ch / 2 + 140);
      ctx.lineTo(cw * 0.64, ch / 2 + 140);
      ctx.stroke();

      const tex = new T.CanvasTexture(c);
      tex.encoding = T.sRGBEncoding;
      tex.anisotropy = 8;
      return tex;
    })();
    toDispose.push({ dispose: () => labelTex.dispose() });

    // Etiqueta proporcional al cuerpo (más ancha que alta)
    const labelW = BW * 1.45;
    const labelH = labelW * (768 / 1024);
    const labelGeo = new T.PlaneGeometry(labelW, labelH);
    const labelMat = new T.MeshBasicMaterial({
      map: labelTex,
      transparent: true,
      depthWrite: false,
    });
    // Posición ligeramente por delante del cristal
    const labelZ = BD + 0.045;
    const labelFront = new T.Mesh(labelGeo, labelMat);
    labelFront.position.set(0, (Y_BASE + Y_BODY_TOP) / 2, labelZ);
    btl.add(labelFront);
    const labelBack = new T.Mesh(labelGeo, labelMat);
    labelBack.position.set(0, (Y_BASE + Y_BODY_TOP) / 2, -labelZ);
    labelBack.rotation.y = Math.PI;
    btl.add(labelBack);
    toDispose.push(labelGeo, labelMat);

    // Sombra elíptica difusa debajo
    const shdGeo = new T.CircleGeometry(BW * 1.5, 64);
    shdGeo.rotateX(-Math.PI / 2);
    const shdMat = new T.MeshBasicMaterial({
      color: 0x0A0F1F, transparent: true, opacity: 0.22, depthWrite: false,
    });
    const shdMesh = new T.Mesh(shdGeo, shdMat);
    shdMesh.position.y = 0.001;
    shdMesh.scale.set(1.0, 1.0, 0.55);
    scene.add(shdMesh);
    toDispose.push(shdGeo, shdMat);

    const TOP_Y = Y_NECK_TOP + 0.10 + CAP_H;

    // Loop: flotación + rotación + ciclo de llenado del líquido +
    //   ondas en la superficie del menisco + chapoteo lateral
    //   LIQ_MIN se mantiene por encima del radio de las esquinas
    //   redondeadas (BR) para que el menisco nunca sobresalga.
    const LIQ_MIN = Y_BASE + BR + 0.25;
    const LIQ_MAX = Y_BODY_TOP - 0.10;
    const LOOP_S  = 9.0;
    const clock = new T.Clock();
    let raf = 0, alive = true;
    let prevRotY = 0;
    let tiltX = 0, tiltZ = 0;       // inclinación del menisco (chapoteo)

    function step() {
      if (!alive) return;
      raf = requestAnimationFrame(step);
      const e = clock.getElapsedTime();
      if (!reducedMotion) {
        btl.position.y = Math.sin(e * 0.5) * 0.06;
        btl.rotation.y = e * 0.18;
      }

      // Curva de relleno: subida (0-65%), hold (65-82%), bajada (82-95%), pausa (95-100%)
      const t = reducedMotion ? 1.0 : (e % LOOP_S) / LOOP_S;
      let level;
      if (t < 0.65) {
        const u = t / 0.65;
        const ease = u * u * (3 - 2 * u);
        level = LIQ_MIN + ease * (LIQ_MAX - LIQ_MIN);
      } else if (t < 0.82) {
        level = LIQ_MAX;
      } else if (t < 0.95) {
        const u = (t - 0.82) / 0.13;
        const ease = u * u * (3 - 2 * u);
        level = LIQ_MAX - ease * (LIQ_MAX - LIQ_MIN);
      } else {
        level = LIQ_MIN;
      }

      // Ligero "respiro" del nivel en el hold para que no se vea estático
      const breath = (t > 0.65 && t < 0.82) ? Math.sin(e * 1.6) * 0.012 : 0;
      const worldLevel = level + breath;

      fillPlane.constant = worldLevel + btl.position.y;
      surfMesh.position.y = worldLevel - 0.002;
      surfMesh.visible = worldLevel > Y_BASE + 0.05;

      // ── Chapoteo: el menisco se inclina ligeramente cuando el frasco gira
      const dRot = (btl.rotation.y - prevRotY);
      prevRotY = btl.rotation.y;
      // suavizado tipo spring hacia la dirección del giro
      const targetTilt = Math.max(-0.10, Math.min(0.10, dRot * 12));
      tiltZ += (targetTilt - tiltZ) * 0.08;
      tiltX += (Math.sin(e * 0.7) * 0.025 - tiltX) * 0.06;
      surfMesh.rotation.z = tiltZ;
      surfMesh.rotation.x = tiltX;

      // ── Ondas en la superficie del menisco (deformación de vertices)
      if (!reducedMotion) {
        const amp = 0.015;
        for (let i = 0; i < surfPos.count; i++) {
          const x = surfPos.getX(i);
          const z = surfPos.getZ(i);
          const wave = Math.sin(x * 7.0 + e * 2.4) * 0.6
                     + Math.sin(z * 9.0 + e * 1.7) * 0.5
                     + Math.sin((x + z) * 5.0 - e * 1.2) * 0.3;
          surfPos.setY(i, surfBaseY[i] + wave * amp);
        }
        surfPos.needsUpdate = true;
        surfGeo.computeVertexNormals();
      }

      renderer.render(scene, camera);
    }
    step();

    const onResize = () => {
      const w = mount.clientWidth, h = mount.clientHeight;
      if (!w || !h) return;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    };
    const ro = window.ResizeObserver ? new ResizeObserver(onResize) : null;
    if (ro) ro.observe(mount); else window.addEventListener('resize', onResize);

    return () => {
      alive = false;
      cancelAnimationFrame(raf);
      if (ro) ro.disconnect(); else window.removeEventListener('resize', onResize);
      try { mount.removeChild(renderer.domElement); } catch (_e) {}
      toDispose.forEach(o => { try { o.dispose(); } catch (_e) {} });
      renderer.dispose();
    };
  }, []);

  return <div ref={mountRef} className="tn-bottle-3d" aria-hidden="true" />;
}

/* ============================================================
   FILTER PANEL
   ============================================================ */
function FilterPanel({ filters, setFilters }) {
  const set = (key, val) =>
    setFilters((f) => ({ ...f, [key]: f[key] === val ? null : val }));

  const clear = () => setFilters({ familia: null, season: null, gender: null });

  return (
    <div className="tn-filters">
      <div className="tn-filter-grid">
        <FilterGroup label="Familia">
          {FAMILIA_OPTIONS.map((f) => (
            <button
              key={f}
              className={'tn-fchip' + (filters.familia === f ? ' on' : '')}
              onClick={() => set('familia', f)}
            >{FAMILIA_LABELS[f]}</button>
          ))}
        </FilterGroup>
        <FilterGroup label="Estación">
          {SEASON_OPTIONS.map((s) => (
            <button
              key={s}
              className={'tn-fchip' + (filters.season === s ? ' on' : '')}
              onClick={() => set('season', s)}
            >{cap(s)}</button>
          ))}
        </FilterGroup>
        <FilterGroup label="Género">
          {GENDER_OPTIONS.map((g) => (
            <button
              key={g}
              className={'tn-fchip' + (filters.gender === g ? ' on' : '')}
              onClick={() => set('gender', g)}
            >{cap(g)}</button>
          ))}
        </FilterGroup>
      </div>
      {Object.values(filters).some((v) => v !== null) && (
        <button className="tn-clear" onClick={clear}>
          × Limpiar filtros
        </button>
      )}
    </div>
  );
}

function FilterGroup({ label, children }) {
  return (
    <div>
      <div className="tn-flabel">{label}</div>
      <div className="tn-fchips">{children}</div>
    </div>
  );
}

/* ============================================================
   RESULTS VIEW
   ============================================================ */
function ResultsView({ query, filters, results, loading, error, onBack, onRetry, onCardOpen, favorites, toggleFavorite }) {
  const activeF = [
    filters?.familia && (FAMILIA_LABELS[filters.familia] || cap(filters.familia)),
    filters?.season && cap(filters.season),
    filters?.gender && cap(filters.gender),
  ].filter(Boolean);

  return (
    <main className="tn-main">
      <Reveal y={40} duration={0.9}>
      <section className="tn-split" style={{ marginTop: 56 }}>
        <h2>
          {loading ? 'Buscando…' : 'Tus coincidencias'}
          {!loading && results.length > 0 && <span className="count">{results.length}</span>}
        </h2>
        <div className="meta">
          <span>Para <b>"{query}"</b></span>
          {activeF.length > 0 && (
            <span style={{ display: 'inline-flex', gap: 6, flexWrap: 'wrap' }}>
              {activeF.map((f, i) => (
                <span key={i} style={{
                  background: 'var(--bg-soft)', padding: '3px 9px', borderRadius: 999,
                  fontSize: 12, fontWeight: 500, color: 'var(--ink-soft)',
                }}>{f}</span>
              ))}
            </span>
          )}
          <button className="tn-sort" onClick={onBack}>
            <SvgArrowLeft size={14} /> Nueva búsqueda
          </button>
        </div>
      </section>
      </Reveal>

      {loading && <LoadingGrid />}

      {error && !loading && (
        <div className="tn-error" style={{ marginTop: 36, maxWidth: 'none' }}>
          <span><b>El perfumista no ha podido responder:</b> {error}</span>
          <button onClick={onRetry}>Reintentar →</button>
        </div>
      )}

      {!loading && !error && results.length > 0 && (
        <section className="tn-grid">
          {results.map((r, i) => {
            const p = CATALOG.find((x) => x.id === r.id);
            if (!p) return null;
            return (
              <PerfumeCard
                key={r.id}
                perfume={p}
                rank={i + 1}
                score={r.score}
                isFavorite={favorites.includes(r.id)}
                onToggleFavorite={() => toggleFavorite(r.id)}
                onOpen={() => onCardOpen({ perfume: p, score: r.score, reasoning: r.reasoning })}
                index={i}
              />
            );
          })}
        </section>
      )}

      <Footer />
    </main>
  );
}

/* ============================================================
   PERFUME CARD
   ============================================================ */
function PerfumeCard({ perfume, rank, score, isFavorite, onToggleFavorite, onOpen, index = 0 }) {
  const tint = getTint(perfume.familia);
  const initial = (perfume.nombre || '').replace(/[^A-Za-z0-9]/g, '').charAt(0).toUpperCase() || 'T';
  const notesSummary = [
    (perfume.notas?.salida || [])[0],
    (perfume.notas?.corazon || [])[0],
    (perfume.notas?.fondo || [])[0],
  ].filter(Boolean).join(' · ');

  const isTop = rank === 1 && score != null;
  const hasRating = typeof perfume.rating === 'number' && perfume.rating > 0;

  // Si Framer Motion no está disponible, renderizamos un <article> normal.
  const Card = motion ? motion.article : 'article';
  const motionProps = motion ? {
    initial: { opacity: 0, y: 50 },
    whileInView: { opacity: 1, y: 0 },
    viewport: { once: true, margin: '-5% 0px -5% 0px' },
    transition: {
      duration: 0.85,
      ease: EASE_CINE,
      delay: Math.min(index, 11) * 0.06,
    },
    whileHover: { y: -8, transition: { duration: 0.35, ease: EASE_CINE } },
  } : {};

  return (
    <Card className="tn-card" onClick={onOpen} {...motionProps}>
      <div className="tn-frame" style={{
        background: `linear-gradient(160deg, ${tint.from} 0%, ${tint.to} 100%)`,
      }}>
        {score != null && (
          <span className={'tn-badge' + (isTop ? ' top' : '')}>
            <span className="dot" />
            {score}% {isTop && '· top'}
          </span>
        )}
        <button
          className={'tn-heart' + (isFavorite ? ' on' : '')}
          onClick={(e) => { e.stopPropagation(); onToggleFavorite(); }}
          aria-label={isFavorite ? 'Quitar de guardados' : 'Guardar'}
          aria-pressed={isFavorite}
        >
          <Heart size={16} fill={isFavorite ? 'currentColor' : 'none'} strokeWidth={1.4} />
        </button>
        <span className="tn-corner">{FAMILIA_LABELS[perfume.familia] || perfume.familia}</span>

        <PerfumeImage perfume={perfume} tint={tint} initial={initial} large={false} />
      </div>

      <div className="tn-name">
        <div className="tn-who">
          {perfume.nombre}
          <small>{perfume.casa}{perfume.año ? ` · ${perfume.año}` : ''}</small>
        </div>
        {hasRating && (
          <div className="tn-px" title={`${fmtInt(perfume.rating_count)} votos`}>
            ★&nbsp;{perfume.rating.toFixed(1)}
          </div>
        )}
      </div>
      <p className="tn-notes">{notesSummary || autoDesc(perfume)}</p>
    </Card>
  );
}

/* ============================================================
   PERFUME IMAGE — usa imagen oficial si está, fallback a SVG.
   ============================================================ */
function PerfumeImage({ perfume, tint, initial, large = false }) {
  const [failed, setFailed] = useState(false);
  const src = perfume && perfume.imagen;
  if (src && !failed) {
    return (
      <img
        className={large ? 'tn-img tn-img-lg' : 'tn-img'}
        src={src}
        alt={perfume.nombre}
        loading="lazy"
        // Parfumo a veces filtra por Referer; con no-referrer pasa siempre.
        referrerPolicy="no-referrer"
        onError={() => setFailed(true)}
      />
    );
  }
  return <Bottle accent={tint.accent} body={tint.soft} initial={initial} large={large} />;
}

/* ============================================================
   CATALOG VIEW — recorre las 31k+ fragancias con filtros y paginación.

   Estado interno (cat):
     · familia, gender, season, minRating — filtros (single-select)
     · search       — substring sobre nombre o casa
     · sort         — 'popularity' | 'rating' | 'recent'
     · page         — índice 0-based

   Cualquier cambio de filtro/sort resetea page a 0. El pipeline:
   filtra -> ordena -> pagina (36 por página).
   ============================================================ */
const CATALOG_PAGE_SIZE = 36;
const CATALOG_RATING_OPTIONS = [7, 7.5, 8, 8.5, 9];

function CatalogView({ favorites, toggleFavorite, onCardOpen, onGoSearch }) {
  const [cat, setCat] = useState({
    familia: null,
    gender: null,
    season: null,
    minRating: 0,
    search: '',
    sort: 'popularity',
    page: 0,
  });

  // Cambios de filtro/sort resetean page a 0; cambios explícitos de page no.
  const updateCat = (patch) =>
    setCat((prev) => ({ ...prev, ...patch, page: ('page' in patch) ? patch.page : 0 }));

  const filtered = useMemo(() => {
    let pool = CATALOG;
    if (cat.familia)        pool = pool.filter((p) => p.familia === cat.familia);
    if (cat.gender)         pool = pool.filter((p) => p.genero === cat.gender || p.genero === 'unisex');
    if (cat.season)         pool = pool.filter((p) => (p.temporada || []).includes(cat.season));
    if (cat.minRating > 0)  pool = pool.filter((p) => (p.rating || 0) >= cat.minRating);
    if (cat.search.trim()) {
      const q = cat.search.toLowerCase().trim();
      pool = pool.filter((p) =>
        (p.nombre || '').toLowerCase().includes(q) ||
        (p.casa   || '').toLowerCase().includes(q)
      );
    }
    const sorted = pool.slice();
    if (cat.sort === 'rating') {
      sorted.sort((a, b) => (b.rating || 0) - (a.rating || 0));
    } else if (cat.sort === 'recent') {
      sorted.sort((a, b) => (b.año || 0) - (a.año || 0));
    } else {
      // popularity: rating × log(1 + votos) — el mismo prior que usa el prefiltro LLM
      sorted.sort((a, b) => {
        const sa = (a.rating || 0) * Math.log1p(a.rating_count || 0);
        const sb = (b.rating || 0) * Math.log1p(b.rating_count || 0);
        return sb - sa;
      });
    }
    return sorted;
  }, [cat.familia, cat.gender, cat.season, cat.minRating, cat.search, cat.sort]);

  const totalPages = Math.max(1, Math.ceil(filtered.length / CATALOG_PAGE_SIZE));
  const page = Math.min(cat.page, totalPages - 1);
  const pageItems = filtered.slice(page * CATALOG_PAGE_SIZE, (page + 1) * CATALOG_PAGE_SIZE);

  const goToPage = (p) => {
    setCat((prev) => ({ ...prev, page: p }));
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const clearFilters = () =>
    updateCat({ familia: null, gender: null, season: null, minRating: 0, search: '' });

  const hasFilters = cat.familia || cat.gender || cat.season ||
                     cat.minRating > 0 || cat.search.trim();

  const SORT_OPTIONS = [
    { k: 'popularity', l: 'Popularidad' },
    { k: 'rating',     l: 'Valoración' },
    { k: 'recent',     l: 'Año' },
  ];

  return (
    <main className="tn-main">
      <Stagger as="section" gap={0.10} duration={1.0} y={48}
               className="tn-hero" style={{ padding: '64px 0 0' }}>
        <span className="tn-pill"><span className="dot" /> Catálogo</span>
        <h1 className="tn-title tn-title-compact">
          Explora el <em>archivo.</em>
        </h1>
        <p className="tn-sub">
          {fmtInt(CATALOG.length)} fragancias indexadas. Filtra por familia, género o estación;
          busca por nombre o casa.
        </p>
      </Stagger>

      <section className="tn-cat-bar">
        <div className="tn-cat-search-wrap">
          <SvgSearch />
          <input
            className="tn-cat-search"
            type="text"
            value={cat.search}
            onChange={(e) => updateCat({ search: e.target.value })}
            placeholder="Buscar por nombre o casa…"
            aria-label="Buscar en el catálogo"
          />
          {cat.search && (
            <button
              className="tn-cat-search-clear"
              onClick={() => updateCat({ search: '' })}
              aria-label="Limpiar búsqueda"
              type="button"
            >
              <X size={13} />
            </button>
          )}
        </div>

        <div className="tn-cat-sort">
          <span className="tn-cat-sort-label">Ordenar</span>
          {SORT_OPTIONS.map((o) => (
            <button
              key={o.k}
              className={'tn-cat-sort-btn' + (cat.sort === o.k ? ' on' : '')}
              onClick={() => updateCat({ sort: o.k })}
              type="button"
            >{o.l}</button>
          ))}
        </div>
      </section>

      <section className="tn-cat-filters">
        <CatFilterRow label="Familia">
          {FAMILIA_OPTIONS.map((f) => (
            <button
              key={f}
              className={'tn-fchip' + (cat.familia === f ? ' on' : '')}
              onClick={() => updateCat({ familia: cat.familia === f ? null : f })}
              type="button"
            >{FAMILIA_LABELS[f]}</button>
          ))}
        </CatFilterRow>
        <CatFilterRow label="Género">
          {GENDER_OPTIONS.map((g) => (
            <button
              key={g}
              className={'tn-fchip' + (cat.gender === g ? ' on' : '')}
              onClick={() => updateCat({ gender: cat.gender === g ? null : g })}
              type="button"
            >{cap(g)}</button>
          ))}
        </CatFilterRow>
        <CatFilterRow label="Estación">
          {SEASON_OPTIONS.map((s) => (
            <button
              key={s}
              className={'tn-fchip' + (cat.season === s ? ' on' : '')}
              onClick={() => updateCat({ season: cat.season === s ? null : s })}
              type="button"
            >{cap(s)}</button>
          ))}
        </CatFilterRow>
        <CatFilterRow label="Rating mínimo">
          {CATALOG_RATING_OPTIONS.map((r) => (
            <button
              key={r}
              className={'tn-fchip' + (cat.minRating === r ? ' on' : '')}
              onClick={() => updateCat({ minRating: cat.minRating === r ? 0 : r })}
              type="button"
            >★ {r}+</button>
          ))}
        </CatFilterRow>
      </section>

      <section className="tn-cat-meta">
        <div className="tn-cat-meta-l">
          <span><b>{fmtInt(filtered.length)}</b> resultados</span>
          {filtered.length > 0 && (
            <span style={{ color: 'var(--ink-mute)' }}>
              · Página <b style={{ color: 'var(--ink)' }}>{page + 1}</b> de {totalPages}
            </span>
          )}
        </div>
        {hasFilters && (
          <button className="tn-clear" onClick={clearFilters}>× Limpiar filtros</button>
        )}
      </section>

      {filtered.length === 0 ? (
        <div className="tn-empty">
          <p>No hay perfumes que coincidan con los filtros aplicados.</p>
          <button onClick={clearFilters}>Limpiar filtros</button>
        </div>
      ) : (
        <>
          <section className="tn-grid">
            {pageItems.map((p, i) => (
              <PerfumeCard
                key={p.id}
                perfume={p}
                rank={0}
                score={null}
                isFavorite={favorites.includes(p.id)}
                onToggleFavorite={() => toggleFavorite(p.id)}
                onOpen={() => onCardOpen({ perfume: p, score: null, reasoning: null })}
                index={i}
              />
            ))}
          </section>

          {totalPages > 1 && (
            <Pagination page={page} total={totalPages} onChange={goToPage} />
          )}
        </>
      )}

      <Footer />
    </main>
  );
}

function CatFilterRow({ label, children }) {
  return (
    <div className="tn-cat-filter-row">
      <div className="tn-cat-filter-label">{label}</div>
      <div className="tn-cat-filter-chips">{children}</div>
    </div>
  );
}

/* Paginación numérica con elipsis: 1 … 4 5 6 … 20 */
function Pagination({ page, total, onChange }) {
  const items = getPageRange(page + 1, total);
  return (
    <nav className="tn-pagination" aria-label="Paginación">
      <button
        className="tn-pag-btn tn-pag-arrow"
        onClick={() => onChange(Math.max(0, page - 1))}
        disabled={page === 0}
        aria-label="Página anterior"
        type="button"
      >
        <SvgArrowLeft size={14} />
      </button>
      {items.map((it, i) => (
        it === '...' ? (
          <span key={i} className="tn-pag-ellipsis">…</span>
        ) : (
          <button
            key={i}
            className={'tn-pag-btn' + (it === page + 1 ? ' on' : '')}
            onClick={() => onChange(it - 1)}
            aria-current={it === page + 1 ? 'page' : undefined}
            type="button"
          >{it}</button>
        )
      ))}
      <button
        className="tn-pag-btn tn-pag-arrow"
        onClick={() => onChange(Math.min(total - 1, page + 1))}
        disabled={page >= total - 1}
        aria-label="Página siguiente"
        type="button"
      >
        <SvgArrowRightThick size={14} />
      </button>
    </nav>
  );
}

function getPageRange(current, total) {
  if (total <= 7) return Array.from({ length: total }, (_, i) => i + 1);
  const set = new Set([1, total, current, current - 1, current + 1]);
  const pages = [...set].filter((p) => p >= 1 && p <= total).sort((a, b) => a - b);
  const out = [];
  for (let i = 0; i < pages.length; i++) {
    if (i > 0 && pages[i] - pages[i - 1] > 1) out.push('...');
    out.push(pages[i]);
  }
  return out;
}

/* ============================================================
   HELPERS — fecha + iconos secundarios
   ============================================================ */
function formatDate(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const date = d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' });
  const time = d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
